---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 526516
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: travel,life
  description: Next trains at any Île-de-France station (Transilien, RER, metro, tram), with line, destination, mission code, platform and delays, from the Île-de-France Mobilités PRIM API. You need a free PRIM API key and your station's stop area id (ZdAId), both explained below. Labels in English or French.
  description-fr: Prochains trains dans n'importe quelle gare d'Île-de-France (Transilien, RER, métro, tram), avec ligne, destination, code mission, voie et retards, depuis l'API PRIM d'Île-de-France Mobilités. Il vous faut une clé d'API PRIM gratuite et l'identifiant de zone d'arrêt de votre gare (ZdAId), expliqués ci-dessous. Libellés en anglais ou en français.
  github_url: https://github.com/adechassey/trmnl-idfm-trains
  learn_more_url: https://prim.iledefrance-mobilites.fr
- keyname: api_key
  field_type: string
  name: PRIM API key
  description: Île-de-France Mobilités API key (free, 1,000 requests per day).
  description-fr: Clé d'API Île-de-France Mobilités (gratuite, 1 000 requêtes par jour).
  help_text: Create an account on <a href="https://prim.iledefrance-mobilites.fr" class="underline">prim.iledefrance-mobilites.fr</a>, then generate a key under "Mes clés d'API".
  placeholder: your PRIM key
- keyname: stop_area_id
  field_type: string
  name: Station id
  description: IDFM stop area id (ZdA). E.g. 58774 for Massy - Palaiseau.
  description-fr: Identifiant de zone d'arrêt IDFM (ZdA). Ex. 58774 pour Massy - Palaiseau.
  help_text: Find your station in the <a href="https://data.iledefrance-mobilites.fr/explore/dataset/zones-d-arrets/table/?refine.zdatype=railStation" class="underline">IDFM stop areas dataset</a> and copy the "ZdAId" column.
  default: '58774'
  placeholder: '58774'
- keyname: station_name
  field_type: string
  name: Display name
  description: Screen title. Empty = name returned by the API.
  description-fr: Titre de l'écran. Vide = nom renvoyé par l'API.
  optional: true
  placeholder: Massy - Palaiseau
- keyname: lines
  field_type: string
  name: Lines
  description: Lines to show, comma-separated (e.g. L,U). Empty = all.
  description-fr: Lignes à afficher, séparées par des virgules (ex. L,U). Vide = toutes.
  optional: true
  placeholder: L,U
- keyname: destinations
  field_type: string
  name: Destinations
  description: Only show trains whose destination contains one of these comma-separated words. Empty = all.
  description-fr: N'afficher que les trains dont la destination contient l'un de ces mots, séparés par des virgules. Vide = toutes.
  optional: true
  placeholder: Paris, Aéroport
- keyname: max_trains
  field_type: number
  name: Number of trains
  description: Maximum number of trains on the full screen (1 to 12).
  description-fr: Nombre maximum de trains sur l'écran complet (1 à 12).
  help_text: Smaller layouts cap this on their own - horizontal half 5, vertical half 8, quadrant 4 (8 on TRMNL X) - and hide rows that do not fit.
  default: 8
  min: 1
  max: 12
  optional: true
name: Julien
description: ''
refresh_interval: 15
